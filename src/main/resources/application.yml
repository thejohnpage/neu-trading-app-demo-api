spring:
  application:
    name: neu-trading-app-demo-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trading_demo}
    username: ${DB_USERNAME:trading_demo}
    password: ${DB_PASSWORD:trading}
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: trading-execution
      auto-offset-reset: earliest
    producer:
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: ${spring.application.name}
    version: 0.1.0-SNAPSHOT

mybatis:
  type-handlers-package: com.neueda.leap.trading.config
  configuration:
    map-underscore-to-camel-case: true

app:
  auth:
    mode: ${AUTH_MODE:jwt}
    validation-url: ${AUTH_VALIDATION_URL:http://localhost:3001/api/v1/auth/validate}
